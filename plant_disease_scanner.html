<style>
  :root {
    --paper: #F1ECDE;
    --paper-dark: #E6DEC8;
    --ink: #23301F;
    --moss: #4A6741;
    --moss-dark: #35492F;
    --rust: #A6522C;
    --rust-dark: #7E3D1F;
    --soil: #6B5237;
    --lime: #8FA968;
    --line: rgba(35, 48, 31, 0.18);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'IBM Plex Sans', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; }

  .pd-app {
    background: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--line) 27px, var(--line) 28px);
    color: var(--ink);
    font-family: var(--font-body);
    padding: 28px 20px 40px;
    border-radius: 4px;
    max-width: 560px;
    margin: 0 auto;
    position: relative;
  }

  .pd-eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--soil);
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
    margin-bottom: 6px;
  }

  .pd-title {
    font-family: var(--font-display);
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.05;
    margin: 14px 0 4px;
    color: var(--moss-dark);
  }

  .pd-sub {
    font-size: 14px;
    color: var(--soil);
    margin-bottom: 22px;
    max-width: 40ch;
  }

  .pd-frame {
    position: relative;
    background: var(--ink);
    border-radius: 6px;
    overflow: hidden;
    aspect-ratio: 4/5;
    border: 2px solid var(--ink);
    box-shadow: 0 6px 0 var(--paper-dark), 0 6px 1px var(--line);
  }

  .pd-frame video, .pd-frame canvas, .pd-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .pd-frame .pd-hidden { display: none !important; }

  .pd-corner {
    position: absolute;
    width: 22px;
    height: 22px;
    border: 2px solid var(--lime);
    opacity: 0.9;
    pointer-events: none;
  }
  .pd-corner.tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .pd-corner.tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
  .pd-corner.bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
  .pd-corner.br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  .pd-idle-msg {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: var(--paper);
    text-align: center;
    padding: 20px;
  }

  .pd-idle-msg svg { opacity: 0.75; }
  .pd-idle-msg p { font-size: 13px; color: #D8D2BE; max-width: 26ch; margin: 0; }

  .pd-analyzing {
    position: absolute;
    inset: 0;
    background: rgba(35,48,31,0.72);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--paper);
  }

  .pd-spinner {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 3px solid rgba(241,236,222,0.25);
    border-top-color: var(--lime);
    animation: pd-spin 0.9s linear infinite;
  }
  @keyframes pd-spin { to { transform: rotate(360deg); } }

  .pd-analyzing span {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.05em;
  }

  .pd-controls {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .pd-btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    padding: 12px 18px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    flex: 1;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .pd-btn:active { transform: scale(0.97); }
  .pd-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .pd-btn-primary { background: var(--moss); color: var(--paper); }
  .pd-btn-primary:hover:not(:disabled) { background: var(--moss-dark); }

  .pd-btn-ghost {
    background: transparent;
    color: var(--soil);
    border: 1.5px solid var(--line);
    flex: none;
    width: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pd-btn-ghost:hover { border-color: var(--soil); }

  .pd-upload-row {
    text-align: center;
    margin-top: 10px;
  }
  .pd-upload-label {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--soil);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  .pd-error {
    margin-top: 12px;
    font-size: 13px;
    color: var(--rust-dark);
    background: rgba(166,82,44,0.1);
    border: 1px solid rgba(166,82,44,0.35);
    padding: 10px 12px;
    border-radius: 4px;
  }

  /* Specimen result card */
  .pd-card {
    margin-top: 22px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 20px 20px 6px;
    position: relative;
  }

  .pd-card::before {
    content: '';
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 1px solid var(--line);
    pointer-events: none;
    border-radius: 2px;
  }

  .pd-card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--soil);
    margin-bottom: 10px;
  }

  .pd-plant-name {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 2px;
  }

  .pd-status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0 16px;
  }

  .pd-status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex: none;
  }
  .pd-status-dot.healthy { background: var(--lime); }
  .pd-status-dot.sick { background: var(--rust); }

  .pd-status-text {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
  }
  .pd-status-text.healthy { color: var(--moss-dark); }
  .pd-status-text.sick { color: var(--rust-dark); }

  .pd-confidence {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--soil);
  }

  .pd-divider {
    border: none;
    border-top: 1px dashed var(--line);
    margin: 14px 0;
  }

  .pd-section-label {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--soil);
    margin-bottom: 6px;
  }

  .pd-section-text {
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink);
    margin: 0 0 16px;
  }

  .pd-section-list {
    margin: 0 0 16px;
    padding-left: 18px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
  }
  .pd-section-list li { margin-bottom: 4px; }

  .pd-disclaimer {
    font-size: 11.5px;
    color: var(--soil);
    border-top: 1px solid var(--line);
    padding: 12px 0 14px;
    line-height: 1.5;
  }

  .pd-scan-again {
    display: block;
    width: 100%;
    margin-top: 16px;
  }

  @media (max-width: 420px) {
    .pd-title { font-size: 28px; }
  }
</style>

<div class="pd-app" id="pdApp">
  <div class="pd-eyebrow">
    <span>Field Diagnostics</span>
    <span id="pdDateStamp"></span>
  </div>
  <h1 class="pd-title">Leaf&nbsp;Scout</h1>
  <p class="pd-sub">Point your camera at a leaf. Leaf Scout reads the symptoms and tells you what's wrong.</p>

  <div class="pd-frame" id="pdFrame">
    <video id="pdVideo" autoplay playsinline muted class="pd-hidden"></video>
    <canvas id="pdCanvas" class="pd-hidden"></canvas>
    <img id="pdShot" class="pd-hidden" alt="Captured leaf" />
    <div class="pd-idle-msg" id="pdIdleMsg">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F1ECDE" stroke-width="1.4">
        <path d="M3 8a2 2 0 012-2h2l1.2-1.6A2 2 0 0110 3.6h4a2 2 0 011.8.8L17 6h2a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
        <circle cx="12" cy="13" r="3.5"/>
      </svg>
      <p>Camera is off. Start it to line up a leaf, or upload a photo instead.</p>
    </div>
    <div class="pd-corner tl"></div>
    <div class="pd-corner tr"></div>
    <div class="pd-corner bl"></div>
    <div class="pd-corner br"></div>
    <div class="pd-analyzing pd-hidden" id="pdAnalyzing">
      <div class="pd-spinner"></div>
      <span id="pdAnalyzingText">READING SYMPTOMS…</span>
    </div>
  </div>

  <div class="pd-controls" id="pdControls">
    <button class="pd-btn pd-btn-primary" id="pdMainBtn">Start camera</button>
  </div>
  <div class="pd-upload-row">
    <label class="pd-upload-label" id="pdUploadLabel">or upload a photo from your device</label>
    <input type="file" accept="image/*" id="pdFileInput" style="display:none" />
  </div>

  <div id="pdErrorBox"></div>
  <div id="pdResults"></div>
</div>

<script>
(function() {
  const $ = (id) => document.getElementById(id);
  const video = $('pdVideo');
  const canvas = $('pdCanvas');
  const shotImg = $('pdShot');
  const idleMsg = $('pdIdleMsg');
  const analyzingOverlay = $('pdAnalyzing');
  const analyzingText = $('pdAnalyzingText');
  const mainBtn = $('pdMainBtn');
  const controls = $('pdControls');
  const uploadLabel = $('pdUploadLabel');
  const fileInput = $('pdFileInput');
  const errorBox = $('pdErrorBox');
  const resultsBox = $('pdResults');
  const dateStamp = $('pdDateStamp');

  let stream = null;
  let state = 'idle'; // idle | camera | captured
  let capturedDataUrl = null;

  dateStamp.textContent = new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

  const analyzingMessages = ['READING SYMPTOMS…', 'CHECKING THE LEAF SURFACE…', 'CROSS-REFERENCING PATTERNS…', 'ALMOST DONE…'];

  function showError(msg) {
    errorBox.innerHTML = `<div class="pd-error">${msg}</div>`;
  }
  function clearError() { errorBox.innerHTML = ''; }

  function setIdleUI() {
    video.classList.add('pd-hidden');
    shotImg.classList.add('pd-hidden');
    canvas.classList.add('pd-hidden');
    idleMsg.classList.remove('pd-hidden');
    controls.innerHTML = '<button class="pd-btn pd-btn-primary" id="pdMainBtn">Start camera</button>';
    document.getElementById('pdMainBtn').addEventListener('click', startCamera);
    uploadLabel.style.display = 'inline';
    state = 'idle';
  }

  function setCameraUI() {
    idleMsg.classList.add('pd-hidden');
    shotImg.classList.add('pd-hidden');
    video.classList.remove('pd-hidden');
    controls.innerHTML = `
      <button class="pd-btn pd-btn-primary" id="pdCaptureBtn">Capture leaf</button>
      <button class="pd-btn pd-btn-ghost" id="pdStopBtn" title="Stop camera">✕</button>
    `;
    document.getElementById('pdCaptureBtn').addEventListener('click', capturePhoto);
    document.getElementById('pdStopBtn').addEventListener('click', stopCamera);
    uploadLabel.style.display = 'inline';
    state = 'camera';
  }

  function setCapturedUI() {
    video.classList.add('pd-hidden');
    idleMsg.classList.add('pd-hidden');
    shotImg.classList.remove('pd-hidden');
    controls.innerHTML = `
      <button class="pd-btn pd-btn-primary" id="pdAnalyzeBtn">Diagnose this leaf</button>
      <button class="pd-btn pd-btn-ghost" id="pdRetakeBtn" title="Retake">↺</button>
    `;
    document.getElementById('pdAnalyzeBtn').addEventListener('click', analyzeLeaf);
    document.getElementById('pdRetakeBtn').addEventListener('click', retake);
    uploadLabel.style.display = 'none';
    state = 'captured';
  }

  async function startCamera() {
    clearError();
    resultsBox.innerHTML = '';
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      });
      video.srcObject = stream;
      setCameraUI();
    } catch (err) {
      showError("Couldn't access your camera. Check that this page has camera permission, or upload a photo instead.");
    }
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    setIdleUI();
  }

  function capturePhoto() {
    const w = video.videoWidth || 640;
    const h = video.videoHeight || 800;
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, w, h);
    capturedDataUrl = canvas.toDataURL('image/jpeg', 0.88);
    shotImg.src = capturedDataUrl;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    setCapturedUI();
  }

  function retake() {
    capturedDataUrl = null;
    resultsBox.innerHTML = '';
    clearError();
    startCamera();
  }

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    clearError();
    resultsBox.innerHTML = '';
    const reader = new FileReader();
    reader.onload = (ev) => {
      capturedDataUrl = ev.target.result;
      shotImg.src = capturedDataUrl;
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      setCapturedUI();
    };
    reader.readAsDataURL(file);
  });
  uploadLabel.addEventListener('click', () => fileInput.click());

  async function analyzeLeaf() {
    if (!capturedDataUrl) return;
    clearError();
    resultsBox.innerHTML = '';
    analyzingOverlay.classList.remove('pd-hidden');
    controls.querySelectorAll('button').forEach(b => b.disabled = true);

    let msgIdx = 0;
    analyzingText.textContent = analyzingMessages[0];
    const msgInterval = setInterval(() => {
      msgIdx = (msgIdx + 1) % analyzingMessages.length;
      analyzingText.textContent = analyzingMessages[msgIdx];
    }, 1400);

    try {
      const base64Data = capturedDataUrl.split(',')[1];
      const mediaType = capturedDataUrl.substring(5, capturedDataUrl.indexOf(';'));

      const systemPrompt = `You are a plant pathology assistant. Look at the leaf/plant photo and respond with ONLY a raw JSON object, no markdown fences, no preamble, no extra text. Schema:
{
  "plant_name": string (common name, or "Unclear from photo" if not identifiable),
  "is_plant": boolean (false if the photo does not show a plant/leaf at all),
  "is_healthy": boolean,
  "condition_name": string (disease/pest/deficiency name, or "Healthy" if no issue, or "Uncertain" if photo quality prevents diagnosis),
  "confidence": number (0-100, your confidence in this specific diagnosis),
  "symptoms_observed": string (1-2 sentences on what you actually see in the image),
  "likely_cause": string (1-2 sentences),
  "treatment_steps": array of 3-5 short actionable strings,
  "prevention_tips": array of 2-3 short strings
}
If the image quality is too poor or it isn't a plant, still fill the schema honestly (is_plant false, low confidence, and explain in symptoms_observed).`;

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: systemPrompt,
          messages: [
            {
              role: "user",
              content: [
                { type: "image", source: { type: "base64", media_type: mediaType, data: base64Data } },
                { type: "text", text: "Diagnose this leaf/plant photo according to the schema." }
              ]
            }
          ]
        })
      });

      if (!response.ok) throw new Error('API request failed: ' + response.status);
      const data = await response.json();
      const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
      const clean = textBlocks.replace(/```json|```/g, '').trim();
      const result = JSON.parse(clean);
      renderResult(result);
    } catch (err) {
      showError("Diagnosis failed — the connection may have dropped, or the response couldn't be read. Try capturing the leaf again with good lighting.");
      console.error(err);
    } finally {
      clearInterval(msgInterval);
      analyzingOverlay.classList.add('pd-hidden');
      controls.querySelectorAll('button').forEach(b => b.disabled = false);
    }
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function renderResult(r) {
    const healthy = !!r.is_healthy;
    const statusClass = healthy ? 'healthy' : 'sick';
    const statusLabel = healthy ? 'Healthy' : (r.condition_name || 'Issue detected');
    const confidence = typeof r.confidence === 'number' ? Math.round(r.confidence) : null;

    const treatmentItems = Array.isArray(r.treatment_steps) ? r.treatment_steps : [];
    const preventionItems = Array.isArray(r.prevention_tips) ? r.prevention_tips : [];

    let html = `
      <div class="pd-card">
        <div class="pd-card-top">
          <span>Specimen Card</span>
          <span>${esc(dateStamp.textContent)}</span>
        </div>
        <p class="pd-plant-name">${esc(r.plant_name || 'Unidentified plant')}</p>
        <div class="pd-status-row">
          <span class="pd-status-dot ${statusClass}"></span>
          <span class="pd-status-text ${statusClass}">${esc(statusLabel)}</span>
          ${confidence !== null ? `<span class="pd-confidence">${confidence}% confidence</span>` : ''}
        </div>
    `;

    if (r.symptoms_observed) {
      html += `<div class="pd-section-label">Observed</div><p class="pd-section-text">${esc(r.symptoms_observed)}</p>`;
    }
    if (!healthy && r.likely_cause) {
      html += `<div class="pd-section-label">Likely cause</div><p class="pd-section-text">${esc(r.likely_cause)}</p>`;
    }
    if (treatmentItems.length) {
      html += `<hr class="pd-divider"><div class="pd-section-label">${healthy ? 'Keep it thriving' : 'Treatment'}</div><ul class="pd-section-list">${treatmentItems.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`;
    }
    if (preventionItems.length) {
      html += `<div class="pd-section-label">Prevention</div><ul class="pd-section-list">${preventionItems.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`;
    }

    html += `
        <div class="pd-disclaimer">Visual assessment only, not a lab diagnosis. For high-value crops or if symptoms worsen, confirm with a local agricultural extension office or plant pathologist.</div>
      </div>
      <button class="pd-btn pd-btn-primary pd-scan-again" id="pdScanAgainBtn">Scan another leaf</button>
    `;

    resultsBox.innerHTML = html;
    document.getElementById('pdScanAgainBtn').addEventListener('click', () => {
      capturedDataUrl = null;
      resultsBox.innerHTML = '';
      setIdleUI();
    });
  }

  setIdleUI();
})();
</script>
