<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leaf Scout | Field Diagnostics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --paper: #F1ECDE;
      --paper-dark: #E6DEC8;
      --ink: #23301F;
      --moss: #4A6741;
      --moss-dark: #35492F;
      --rust: #A6522C;
      --rust-dark: #7E3D1F;
      --soil: #6B5237;
      --lime: #8FA968;
      --line: rgba(35, 48, 31, 0.18);
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'IBM Plex Sans', -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * { box-sizing: border-box; }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: var(--paper);
      overflow-x: hidden;
    }

    /* App Shell - Full Screen Layout */
    .pd-app {
      background: var(--paper);
      background-image: repeating-linear-gradient(0deg, transparent, transparent 27px, var(--line) 27px, var(--line) 28px);
      color: var(--ink);
      font-family: var(--font-body);
      padding: clamp(20px, 4vw, 40px) clamp(16px, 5vw, 32px) 60px;
      width: 100%;
      max-width: 760px; /* Expands wider on desktop screens without floating boxed borders */
      min-height: 100vh;
      margin: 0 auto;
      border: none;
      box-shadow: none;
      position: relative;
    }

    /* Header Details */
    .pd-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--soil);
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
      margin-bottom: 8px;
    }

    .pd-title {
      font-family: var(--font-display);
      font-optical-sizing: auto;
      font-weight: 600;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.05;
      margin: 14px 0 6px;
      color: var(--moss-dark);
    }

    .pd-sub {
      font-size: clamp(14px, 2.5vw, 16px);
      color: var(--soil);
      margin-bottom: clamp(20px, 4vw, 28px);
      max-width: 52ch;
      line-height: 1.45;
    }

    /* Animated Field Frame */
    .pd-frame-wrapper {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
    }

    .pd-frame {
      position: relative;
      background: var(--ink);
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 4/4.5;
      width: 100%;
      border: 2px solid var(--ink);
      box-shadow: 0 6px 0 var(--paper-dark), 0 10px 20px rgba(0,0,0,0.12);
      transition: transform 0.3s ease;
    }

    @media (max-height: 700px) {
      .pd-frame { aspect-ratio: 4/3.2; }
    }

    .pd-frame video, .pd-frame canvas, .pd-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s ease;
    }

    .pd-frame .pd-hidden { display: none !important; }

    /* Frame Scanning Overlay Animation */
    .pd-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(143, 169, 104, 0.12) 50%, transparent 60%);
      background-size: 100% 200%;
      animation: pdScanLine 4s linear infinite;
      pointer-events: none;
    }

    /* Animated Frame Corners */
    .pd-corner {
      position: absolute;
      width: clamp(18px, 4vw, 24px);
      height: clamp(18px, 4vw, 24px);
      border: 2px solid var(--lime);
      opacity: 0.9;
      pointer-events: none;
      z-index: 2;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .pd-corner.tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
    .pd-corner.tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
    .pd-corner.bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
    .pd-corner.br { bottom: 12px; right: 12px; border-left: none; border-top: none; }

    .pd-idle-msg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--paper);
      text-align: center;
      padding: 24px;
      background: radial-gradient(circle, rgba(35, 48, 31, 0.88) 0%, rgba(20, 28, 18, 0.96) 100%);
    }

    .pd-idle-msg svg {
      opacity: 0.85;
      width: clamp(36px, 8vw, 46px);
      height: clamp(36px, 8vw, 46px);
      animation: pdPulseSvg 3s infinite alternate ease-in-out;
    }
    .pd-idle-msg p { font-size: clamp(13px, 2.5vw, 14.5px); color: #D8D2BE; max-width: 32ch; margin: 0; line-height: 1.45; }

    /* Diagnostics Loader */
    .pd-analyzing {
      position: absolute;
      inset: 0;
      background: rgba(35, 48, 31, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--paper);
      z-index: 5;
      animation: pdFadeIn 0.25s ease;
    }

    .pd-spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(241, 236, 222, 0.2);
      border-top-color: var(--lime);
      animation: pdSpin 0.8s linear infinite;
    }

    .pd-analyzing span {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    /* Controls & Mobile Touch Targets */
    .pd-controls {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .pd-btn {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: clamp(14px, 3vw, 15px);
      padding: 14px 20px;
      min-height: 52px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .pd-btn:active { transform: scale(0.97); }
    .pd-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .pd-btn-primary {
      background: var(--moss);
      color: var(--paper);
      box-shadow: 0 4px 12px rgba(74, 103, 65, 0.25);
    }
    .pd-btn-primary:hover:not(:disabled) {
      background: var(--moss-dark);
      box-shadow: 0 6px 16px rgba(74, 103, 65, 0.35);
      transform: translateY(-1px);
    }

    .pd-btn-ghost {
      background: transparent;
      color: var(--soil);
      border: 1.5px solid var(--line);
      flex: none;
      width: 52px;
      font-size: 18px;
    }
    .pd-btn-ghost:hover {
      border-color: var(--soil);
      background: rgba(107, 82, 55, 0.06);
    }

    /* Upload Action */
    .pd-upload-row {
      text-align: center;
      margin-top: 14px;
    }
    .pd-upload-label {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--soil);
      text-decoration: underline;
      text-underline-offset: 4px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 4px;
      transition: background 0.2s ease;
    }
    .pd-upload-label:hover {
      background: rgba(107, 82, 55, 0.08);
    }

    .pd-error {
      margin-top: 16px;
      font-size: 13.5px;
      color: var(--rust-dark);
      background: rgba(166, 82, 44, 0.1);
      border: 1px solid rgba(166, 82, 44, 0.35);
      padding: 12px 16px;
      border-radius: 4px;
      animation: pdSlideUp 0.3s ease;
    }

    /* Specimen Card Result */
    .pd-card {
      margin-top: 26px;
      background: var(--paper);
      border: 1.5px solid var(--ink);
      border-radius: 4px;
      padding: clamp(18px, 4vw, 28px) clamp(18px, 4vw, 28px) 12px;
      position: relative;
      animation: pdCardReveal 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      box-shadow: 0 10px 25px rgba(35, 48, 31, 0.08);
    }

    .pd-card::before {
      content: '';
      position: absolute;
      top: 7px; left: 7px; right: 7px; bottom: 7px;
      border: 1px solid var(--line);
      pointer-events: none;
      border-radius: 2px;
    }

    .pd-card-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--soil);
      margin-bottom: 12px;
    }

    .pd-plant-name {
      font-family: var(--font-display);
      font-size: clamp(22px, 5vw, 28px);
      font-weight: 600;
      color: var(--ink);
      margin: 0 0 2px;
      overflow-wrap: break-word;
    }

    .pd-status-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      row-gap: 6px;
      gap: 10px;
      margin: 10px 0 18px;
    }

    .pd-status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex: none;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.6);
    }
    .pd-status-dot.healthy { background: var(--lime); }
    .pd-status-dot.sick { background: var(--rust); }

    .pd-status-text {
      font-family: var(--font-mono);
      font-size: 13.5px;
      font-weight: 500;
    }
    .pd-status-text.healthy { color: var(--moss-dark); }
    .pd-status-text.sick { color: var(--rust-dark); }

    .pd-confidence {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--soil);
      background: var(--paper-dark);
      padding: 3px 9px;
      border-radius: 3px;
    }

    .pd-divider {
      border: none;
      border-top: 1px dashed var(--line);
      margin: 16px 0;
    }

    .pd-section-label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--soil);
      margin-bottom: 6px;
    }

    .pd-section-text {
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--ink);
      margin: 0 0 16px;
    }

    .pd-section-list {
      margin: 0 0 16px;
      padding-left: 18px;
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--ink);
    }
    .pd-section-list li { margin-bottom: 5px; }

    .pd-disclaimer {
      font-size: 12px;
      color: var(--soil);
      border-top: 1px solid var(--line);
      padding: 14px 0;
      line-height: 1.5;
    }

    .pd-scan-again {
      display: block;
      width: 100%;
      margin-top: 18px;
    }

    /* Keyframe Animations */
    @keyframes pdScanLine {
      0% { background-position: 0 -100%; }
      100% { background-position: 0 100%; }
    }

    @keyframes pdSpin {
      to { transform: rotate(360deg); }
    }

    @keyframes pdPulseSvg {
      0% { transform: scale(0.96); opacity: 0.75; }
      100% { transform: scale(1.04); opacity: 0.95; }
    }

    @keyframes pdCardReveal {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pdSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pdFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 380px) {
      .pd-controls { gap: 8px; }
      .pd-btn { padding: 12px 10px; font-size: 13.5px; }
      .pd-status-row { flex-direction: column; align-items: flex-start; }
      .pd-confidence { margin-left: 0; }
    }
  </style>
</head>
<body>

<div class="pd-app" id="pdApp">
  <div class="pd-eyebrow">
    <span>Field Diagnostics</span>
    <span id="pdDateStamp"></span>
  </div>
  <h1 class="pd-title">Leaf Scout</h1>
  <p class="pd-sub">Point your camera at a leaf. Leaf Scout reads the symptoms and gives you a diagnostic specimen card.</p>

  <div class="pd-frame-wrapper">
    <div class="pd-frame" id="pdFrame">
      <video id="pdVideo" autoplay playsinline muted class="pd-hidden"></video>
      <canvas id="pdCanvas" class="pd-hidden"></canvas>
      <img id="pdShot" class="pd-hidden" alt="Captured leaf" />
      <div class="pd-idle-msg" id="pdIdleMsg">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F1ECDE" stroke-width="1.4">
          <path d="M3 8a2 2 0 012-2h2l1.2-1.6A2 2 0 0110 3.6h4a2 2 0 011.8.8L17 6h2a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
          <circle cx="12" cy="13" r="3.5"/>
        </svg>
        <p>Camera is off. Start it to line up a leaf, or upload a photo from your device.</p>
      </div>
      <div class="pd-corner tl"></div>
      <div class="pd-corner tr"></div>
      <div class="pd-corner bl"></div>
      <div class="pd-corner br"></div>
      <div class="pd-analyzing pd-hidden" id="pdAnalyzing">
        <div class="pd-spinner"></div>
        <span id="pdAnalyzingText">READING SYMPTOMS…</span>
      </div>
    </div>

    <div class="pd-controls" id="pdControls">
      <button class="pd-btn pd-btn-primary" id="pdMainBtn">Start camera</button>
    </div>
    <div class="pd-upload-row">
      <label class="pd-upload-label" id="pdUploadLabel">or upload a photo from your device</label>
      <input type="file" accept="image/*" id="pdFileInput" style="display:none" />
    </div>

    <div id="pdErrorBox"></div>
    <div id="pdResults"></div>
  </div>
</div>

<script>
(function() {
  const $ = (id) => document.getElementById(id);
  const video = $('pdVideo');
  const canvas = $('pdCanvas');
  const shotImg = $('pdShot');
  const idleMsg = $('pdIdleMsg');
  const analyzingOverlay = $('pdAnalyzing');
  const analyzingText = $('pdAnalyzingText');
  const controls = $('pdControls');
  const uploadLabel = $('pdUploadLabel');
  const fileInput = $('pdFileInput');
  const errorBox = $('pdErrorBox');
  const resultsBox = $('pdResults');
  const dateStamp = $('pdDateStamp');

  let stream = null;
  let state = 'idle'; // idle | camera | captured
  let capturedDataUrl = null;

  dateStamp.textContent = new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

  const analyzingMessages = ['READING SYMPTOMS…', 'CHECKING LEAF SURFACE…', 'CROSS-REFERENCING PATTERNS…', 'ALMOST DONE…'];

  function showError(msg) {
    errorBox.innerHTML = `<div class="pd-error">${msg}</div>`;
  }
  function clearError() { errorBox.innerHTML = ''; }

  function setIdleUI() {
    video.classList.add('pd-hidden');
    shotImg.classList.add('pd-hidden');
    canvas.classList.add('pd-hidden');
    idleMsg.classList.remove('pd-hidden');
    controls.innerHTML = '<button class="pd-btn pd-btn-primary" id="pdMainBtn">Start camera</button>';
    document.getElementById('pdMainBtn').addEventListener('click', startCamera);
    uploadLabel.style.display = 'inline-block';
    state = 'idle';
  }

  function setCameraUI() {
    idleMsg.classList.add('pd-hidden');
    shotImg.classList.add('pd-hidden');
    video.classList.remove('pd-hidden');
    controls.innerHTML = `
      <button class="pd-btn pd-btn-primary" id="pdCaptureBtn">Capture leaf</button>
      <button class="pd-btn pd-btn-ghost" id="pdStopBtn" title="Stop camera">✕</button>
    `;
    document.getElementById('pdCaptureBtn').addEventListener('click', capturePhoto);
    document.getElementById('pdStopBtn').addEventListener('click', stopCamera);
    uploadLabel.style.display = 'inline-block';
    state = 'camera';
  }

  function setCapturedUI() {
    video.classList.add('pd-hidden');
    idleMsg.classList.add('pd-hidden');
    shotImg.classList.remove('pd-hidden');
    controls.innerHTML = `
      <button class="pd-btn pd-btn-primary" id="pdAnalyzeBtn">Diagnose this leaf</button>
      <button class="pd-btn pd-btn-ghost" id="pdRetakeBtn" title="Retake">↺</button>
    `;
    document.getElementById('pdAnalyzeBtn').addEventListener('click', analyzeLeaf);
    document.getElementById('pdRetakeBtn').addEventListener('click', retake);
    uploadLabel.style.display = 'none';
    state = 'captured';
  }

  async function startCamera() {
    clearError();
    resultsBox.innerHTML = '';
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      });
      video.srcObject = stream;
      setCameraUI();
    } catch (err) {
      showError("Couldn't access camera. Check permissions or upload a photo instead.");
    }
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    setIdleUI();
  }

  function capturePhoto() {
    const w = video.videoWidth || 640;
    const h = video.videoHeight || 800;
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, w, h);
    capturedDataUrl = canvas.toDataURL('image/jpeg', 0.88);
    shotImg.src = capturedDataUrl;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    setCapturedUI();
  }

  function retake() {
    capturedDataUrl = null;
    resultsBox.innerHTML = '';
    clearError();
    startCamera();
  }

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    clearError();
    resultsBox.innerHTML = '';
    const reader = new FileReader();
    reader.onload = (ev) => {
      capturedDataUrl = ev.target.result;
      shotImg.src = capturedDataUrl;
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      setCapturedUI();
    };
    reader.readAsDataURL(file);
  });
  uploadLabel.addEventListener('click', () => fileInput.click());

  async function analyzeLeaf() {
    if (!capturedDataUrl) return;
    clearError();
    resultsBox.innerHTML = '';
    analyzingOverlay.classList.remove('pd-hidden');
    controls.querySelectorAll('button').forEach(b => b.disabled = true);

    let msgIdx = 0;
    analyzingText.textContent = analyzingMessages[0];
    const msgInterval = setInterval(() => {
      msgIdx = (msgIdx + 1) % analyzingMessages.length;
      analyzingText.textContent = analyzingMessages[msgIdx];
    }, 1400);

    try {
      const base64Data = capturedDataUrl.split(',')[1];
      const mediaType = capturedDataUrl.substring(5, capturedDataUrl.indexOf(';'));

      const systemPrompt = `You are a plant pathology assistant. Look at the leaf/plant photo and respond with ONLY a raw JSON object, no markdown fences, no preamble. Schema:
{
  "plant_name": string (common name, or "Unclear from photo"),
  "is_plant": boolean,
  "is_healthy": boolean,
  "condition_name": string (disease/pest name, or "Healthy"),
  "confidence": number (0-100),
  "symptoms_observed": string (1-2 sentences),
  "likely_cause": string (1-2 sentences),
  "treatment_steps": array of 3-5 short strings,
  "prevention_tips": array of 2-3 short strings
}`;

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: systemPrompt,
          messages: [
            {
              role: "user",
              content: [
                { type: "image", source: { type: "base64", media_type: mediaType, data: base64Data } },
                { type: "text", text: "Diagnose this leaf/plant photo according to the schema." }
              ]
            }
          ]
        })
      });

      if (!response.ok) throw new Error('API request failed: ' + response.status);
      const data = await response.json();
      const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
      const clean = textBlocks.replace(/```json|```/g, '').trim();
      const result = JSON.parse(clean);
      renderResult(result);
    } catch (err) {
      showError("Diagnosis failed — check connection or try capturing the leaf with clearer lighting.");
      console.error(err);
    } finally {
      clearInterval(msgInterval);
      analyzingOverlay.classList.add('pd-hidden');
      controls.querySelectorAll('button').forEach(b => b.disabled = false);
    }
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function renderResult(r) {
    const healthy = !!r.is_healthy;
    const statusClass = healthy ? 'healthy' : 'sick';
    const statusLabel = healthy ? 'Healthy' : (r.condition_name || 'Issue detected');
    const confidence = typeof r.confidence === 'number' ? Math.round(r.confidence) : null;

    const treatmentItems = Array.isArray(r.treatment_steps) ? r.treatment_steps : [];
    const preventionItems = Array.isArray(r.prevention_tips) ? r.prevention_tips : [];

    let html = `
      <div class="pd-card">
        <div class="pd-card-top">
          <span>Specimen Card</span>
          <span>${esc(dateStamp.textContent)}</span>
        </div>
        <p class="pd-plant-name">${esc(r.plant_name || 'Unidentified plant')}</p>
        <div class="pd-status-row">
          <span class="pd-status-dot ${statusClass}"></span>
          <span class="pd-status-text ${statusClass}">${esc(statusLabel)}</span>
          ${confidence !== null ? `<span class="pd-confidence">${confidence}% confidence</span>` : ''}
        </div>
    `;

    if (r.symptoms_observed) {
      html += `<div class="pd-section-label">Observed</div><p class="pd-section-text">${esc(r.symptoms_observed)}</p>`;
    }
    if (!healthy && r.likely_cause) {
      html += `<div class="pd-section-label">Likely cause</div><p class="pd-section-text">${esc(r.likely_cause)}</p>`;
    }
    if (treatmentItems.length) {
      html += `<hr class="pd-divider"><div class="pd-section-label">${healthy ? 'Keep it thriving' : 'Treatment'}</div><ul class="pd-section-list">${treatmentItems.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`;
    }
    if (preventionItems.length) {
      html += `<div class="pd-section-label">Prevention</div><ul class="pd-section-list">${preventionItems.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`;
    }

    html += `
        <div class="pd-disclaimer">Visual assessment only, not a lab diagnosis. For high-value crops or if symptoms worsen, confirm with a local agricultural extension office or plant pathologist.</div>
      </div>
      <button class="pd-btn pd-btn-primary pd-scan-again" id="pdScanAgainBtn">Scan another leaf</button>
    `;

    resultsBox.innerHTML = html;
    document.getElementById('pdScanAgainBtn').addEventListener('click', () => {
      capturedDataUrl = null;
      resultsBox.innerHTML = '';
      setIdleUI();
    });
  }

  setIdleUI();
})();
</script>
</body>
</html>
